name: atende-dev

# Ambiente de criação isolado. Nunca monte volumes ou segredos da produção aqui.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      OPENWA_INTERNAL_URL: http://openwa:2785
      DATABASE_URL: postgresql://atende:${DEV_POSTGRES_PASSWORD:?Execute scripts/start-dev.ps1 para gerar .env.dev}@postgres:5432/atende
      REDIS_URL: redis://redis:6379
      APP_SESSION_SECRET: ${DEV_APP_SESSION_SECRET:?Execute scripts/start-dev.ps1 para gerar .env.dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openwa:
        condition: service_started
    networks:
      - atende-dev-internal
      - atende-dev-access

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atende
      POSTGRES_USER: atende
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Execute scripts/start-dev.ps1 para gerar .env.dev}
    volumes:
      - dev-postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atende -d atende"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atende-dev-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atende-dev-internal

  openwa:
    build:
      context: ./openwa
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 45s
    shm_size: 1gb
    environment:
      NODE_ENV: production
      PORT: 2785
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: atende
      DATABASE_USERNAME: atende
      DATABASE_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Execute scripts/start-dev.ps1 para gerar .env.dev}
      POSTGRES_SCHEMA: openwa
      DATABASE_SYNCHRONIZE: "false"
      ENGINE_TYPE: whatsapp-web.js
      SESSION_DATA_PATH: /app/data/sessions
      PUPPETEER_HEADLESS: "true"
      WWEBJS_AUTH_TIMEOUT_MS: "180000"
      PUPPETEER_ARGS: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_ENABLED: "true"
      API_MASTER_KEY: ${DEV_OPENWA_MASTER_KEY:?Execute scripts/start-dev.ps1 para gerar .env.dev}
      CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
      AUTO_START_SESSIONS: "false"
      SIMULATE_TYPING: "false"
      MEDIA_DOWNLOAD_ENABLED: "true"
      MEDIA_CONVERSION_ENABLED: "true"
      CHAT_MEDIA_ARCHIVE_ENABLED: "true"
      CHAT_MEDIA_ARCHIVE_OUTBOUND: "true"
      ATENDE_REQUIRE_OPERATOR: "true"
      SERVE_DASHBOARD: "false"
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ""
      GOOGLE_APPS_SCRIPT_URL: ""
      GOOGLE_APPS_SCRIPT_SECRET: ""
      DISCORD_UNASSIGNED_WEBHOOK_URL: ""
    volumes:
      - dev-openwa:/app/data
      - dev-media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atende-dev-internal

volumes:
  dev-postgres:
  dev-redis:
  dev-openwa:
  dev-media:

networks:
  atende-dev-internal:
    internal: true
  atende-dev-access:
    driver: bridge
